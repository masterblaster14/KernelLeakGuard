<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <text x="20" y="28" font-weight="700">Fault injection with fail-nth: "make the n-th memory request of my next system call fail"</text>
  <text x="20" y="62">Loading a module asks for memory many times, always in the same order:</text>
  <g font-size="13">
  <rect x="20" y="80" width="150" height="56" rx="8" fill="#e9f6ec" stroke="#2e9e4f"/><text x="95" y="103" text-anchor="middle">request 1</text><text x="95" y="123" text-anchor="middle">kmalloc ✔</text>
  <rect x="190" y="80" width="150" height="56" rx="8" fill="#e9f6ec" stroke="#2e9e4f"/><text x="265" y="103" text-anchor="middle">request 2</text><text x="265" y="123" text-anchor="middle">kzalloc ✔</text>
  <rect x="360" y="80" width="150" height="56" rx="8" fill="#fdecec" stroke="#d03b3b" stroke-width="3"/><text x="435" y="103" text-anchor="middle" font-weight="700">request 3</text><text x="435" y="123" text-anchor="middle" fill="#d03b3b" font-weight="700">FORCED TO FAIL</text>
  <rect x="530" y="80" width="150" height="56" rx="8" fill="#eee" stroke="#aaa"/><text x="605" y="103" text-anchor="middle" fill="#888">request 4</text><text x="605" y="123" text-anchor="middle" fill="#888">never happens</text>
  <rect x="700" y="80" width="180" height="56" rx="8" fill="#fff4e8" stroke="#eb6834"/><text x="790" y="103" text-anchor="middle">error exit runs</text><text x="790" y="123" text-anchor="middle">(-ENOMEM)</text></g>
  <text x="20" y="170">echo 3 &gt; /proc/self/fail-nth   →  only the 3rd request fails, only for our own program (task-filter).</text>
  <text x="20" y="196"><tspan font-weight="700">Mapping (sweep):</tspan> try n = 1, 2, 3, ... and record which source line each n hits.</text>
  <text x="20" y="222"><tspan font-weight="700">Confirming:</tspan> pick the n that hits the call our analyser predicted, run it 3 times, then ask kmemleak.</text>
  <text x="20" y="248"><tspan font-weight="700">Module filter:</tspan> only count requests that come from the module's own code (stack-trace filter), so numbering is short and stable.</text>
</svg>
