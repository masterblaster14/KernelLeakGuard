<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
  <rect x="20" y="90" width="220" height="110" rx="12" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="130" y="135" text-anchor="middle" font-weight="700">Kernel code</text>
  <text x="130" y="160" text-anchor="middle" fill="#333">(e.g. a driver)</text>
  <rect x="620" y="40" width="260" height="220" rx="12" fill="#f6f6f4" stroke="#888" stroke-width="2"/>
  <text x="750" y="68" text-anchor="middle" font-weight="700">Kernel memory (RAM)</text>
  <g stroke="#888"><rect x="645" y="90" width="60" height="40" fill="#d7ead9"/><rect x="720" y="90" width="60" height="40" fill="#d7ead9"/><rect x="795" y="90" width="60" height="40" fill="#d7ead9"/>
  <rect x="645" y="145" width="60" height="40" fill="#d7ead9"/><rect x="720" y="145" width="60" height="40" fill="#f6c9c9"/><rect x="795" y="145" width="60" height="40" fill="#d7ead9"/>
  <rect x="645" y="200" width="60" height="40" fill="#d7ead9"/><rect x="720" y="200" width="60" height="40" fill="#d7ead9"/><rect x="795" y="200" width="60" height="40" fill="#f6c9c9"/></g>
  <line x1="245" y1="115" x2="610" y2="115" stroke="#2e9e4f" stroke-width="3" marker-end="url(#a)"/>
  <text x="425" y="105" text-anchor="middle" fill="#2e9e4f" font-weight="700">kmalloc(): "please give me memory"</text>
  <line x1="610" y1="160" x2="245" y2="160" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
  <text x="425" y="185" text-anchor="middle" fill="#2a78d6" font-weight="700">kfree(): "here, I'm done with it"</text>
  <text x="20" y="240" fill="#d03b3b" font-weight="700">LEAK = asked with kmalloc() but never gave back with kfree()</text>
  <text x="20" y="263" fill="#d03b3b">→ the red blocks stay taken until the computer restarts</text>
</svg>
